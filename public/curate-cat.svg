<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mascotTitle mascotDesc">
  <title id="mascotTitle">The Curate cat</title>
  <desc id="mascotDesc">A scholarly cat mascot orbited by four badges: a document (written content), a balance scale (fairness), linked blocks (blockchain) and a coin (income). Placeholder art — swap for a generated illustration.</desc>

  <defs>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1A1A" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Card -->
  <rect x="8" y="8" width="384" height="384" rx="30" fill="#FAFAF8" stroke="#E6E5E0" stroke-width="1.5" />

  <!-- Spotlight wash behind the cat -->
  <circle cx="200" cy="188" r="128" fill="#ECECEC" opacity="0.6" />

  <!-- Orbit that the four ideas ride on -->
  <circle cx="200" cy="196" r="169" fill="none" stroke="#1A1A1A" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round" />

  <!-- ============================= THE CAT ============================= -->
  <g transform="translate(96,61.5) scale(6.5)">
    <!-- Ears + head -->
    <path d="M6.2 14.5 L7.6 5.4 Q8.4 2.6 9.6 5.2 L14.2 13.3 Z" fill="#1A1A1A" />
    <path d="M25.8 14.5 L24.4 5.4 Q23.6 2.6 22.4 5.2 L17.8 13.3 Z" fill="#1A1A1A" />
    <path d="M8.4 8 L8.9 5.9 Q9.1 5.2 9.4 5.9 L11 8.8 Z" fill="#52525B" />
    <path d="M23.6 8 L23.1 5.9 Q22.9 5.2 22.6 5.9 L21 8.8 Z" fill="#52525B" />
    <circle cx="16" cy="19" r="11" fill="#1A1A1A" />

    <!-- Whiskers -->
    <g stroke="#FAFAF8" stroke-width="0.22" stroke-linecap="round" opacity="0.7">
      <line x1="8.6" y1="20.4" x2="4.4" y2="19.6" />
      <line x1="8.6" y1="21.3" x2="4.2" y2="21.3" />
      <line x1="8.8" y1="22.2" x2="4.8" y2="23.1" />
      <line x1="23.4" y1="20.4" x2="27.6" y2="19.6" />
      <line x1="23.4" y1="21.3" x2="27.8" y2="21.3" />
      <line x1="23.2" y1="22.2" x2="27.2" y2="23.1" />
    </g>

    <!-- Scholar glasses -->
    <g stroke="#FAFAF8" stroke-width="0.42" fill="none">
      <circle cx="12.1" cy="18.6" r="2.7" />
      <circle cx="19.9" cy="18.6" r="2.7" />
      <line x1="14.8" y1="18.2" x2="17.2" y2="18.2" />
      <line x1="9.5" y1="18.1" x2="7.1" y2="16.6" />
      <line x1="22.5" y1="18.1" x2="24.9" y2="16.6" />
    </g>

    <!-- Eyes -->
    <circle cx="12.1" cy="18.6" r="0.95" fill="#FAFAF8" />
    <circle cx="19.9" cy="18.6" r="0.95" fill="#FAFAF8" />

    <!-- Nose + little smile -->
    <path d="M15.2 21.2 L16.8 21.2 L16 22.3 Z" fill="#FAFAF8" />
    <path d="M16 22.3 Q14.9 23.6 13.9 22.7 M16 22.3 Q17.1 23.6 18.1 22.7" stroke="#FAFAF8" stroke-width="0.3" fill="none" stroke-linecap="round" />
  </g>

  <!-- ============================ BADGES ============================ -->
  <!-- Written content: document -->
  <g transform="translate(30,56)" filter="url(#softShadow)">
    <rect width="72" height="72" rx="20" fill="#FAFAF8" stroke="#E6E5E0" stroke-width="1.5" />
    <g stroke="#1A1A1A" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="24" y="20" width="24" height="32" rx="3" stroke-width="2.5" fill="#FAFAF8" />
      <line x1="29" y1="30" x2="43" y2="30" stroke-width="2" />
      <line x1="29" y1="36" x2="43" y2="36" stroke-width="2" />
      <line x1="29" y1="42" x2="38" y2="42" stroke-width="2" />
    </g>
  </g>

  <!-- Fair: balance scale -->
  <g transform="translate(298,56)" filter="url(#softShadow)">
    <rect width="72" height="72" rx="20" fill="#FAFAF8" stroke="#E6E5E0" stroke-width="1.5" />
    <g stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="36" y1="20" x2="36" y2="49" />
      <line x1="22" y1="25" x2="50" y2="25" />
      <line x1="30" y1="49" x2="42" y2="49" />
      <path d="M22 25 L18 33 M22 25 L26 33 M17 33 Q22 40 27 33" stroke-width="2" />
      <path d="M50 25 L46 33 M50 25 L54 33 M45 33 Q50 40 55 33" stroke-width="2" />
      <circle cx="36" cy="20" r="2.2" fill="#1A1A1A" stroke="none" />
    </g>
  </g>

  <!-- Blockchain: linked blocks -->
  <g transform="translate(30,264)" filter="url(#softShadow)">
    <rect width="72" height="72" rx="20" fill="#FAFAF8" stroke="#E6E5E0" stroke-width="1.5" />
    <g stroke="#1A1A1A" stroke-width="2.5" fill="#FAFAF8" stroke-linejoin="round">
      <rect x="18" y="30" width="13" height="14" rx="3" />
      <rect x="32" y="22" width="13" height="14" rx="3" />
      <rect x="46" y="30" width="13" height="14" rx="3" />
      <line x1="31" y1="36" x2="32" y2="33" stroke-width="2" />
      <line x1="45" y1="33" x2="46" y2="36" stroke-width="2" />
    </g>
  </g>

  <!-- Source of income: coin -->
  <g transform="translate(298,264)" filter="url(#softShadow)">
    <rect width="72" height="72" rx="20" fill="#FAFAF8" stroke="#E6E5E0" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#FAFAF8" stroke="#1A1A1A" stroke-width="2.5" />
    <circle cx="36" cy="36" r="11.5" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-opacity="0.5" />
    <text x="36" y="42.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="17" font-weight="700" fill="#1A1A1A">$</text>
  </g>
</svg>
